<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Cyan Glow Gradient for Title -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Radar Sector Sweep Gradient -->
    <radialGradient id="radarSweep" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.0)" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes radarRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.85; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes blipFade {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .radar-sweep-line {
      transform-origin: 850px 180px;
      animation: radarRotate 8s linear infinite;
    }
    .pulsing-grid {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .flight-path {
      stroke-dasharray: 10, 10;
      animation: dashMove 2s linear infinite;
    }
    .blip-1 { transform-origin: 820px 120px; animation: blipFade 3s ease-in-out infinite; }
    .blip-2 { transform-origin: 940px 220px; animation: blipFade 3s ease-in-out 1.5s infinite; }
    .blip-3 { transform-origin: 750px 240px; animation: blipFade 3s ease-in-out 0.8s infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Background Radar Grid Circles -->
  <g class="pulsing-grid" stroke="#38BDF8" stroke-width="1" opacity="0.15" fill="none">
    <circle cx="850" cy="180" r="60" />
    <circle cx="850" cy="180" r="120" />
    <circle cx="850" cy="180" r="180" />
    <circle cx="850" cy="180" r="240" />
    <line x1="610" y1="180" x2="1090" y2="180" stroke-dasharray="4,4" />
    <line x1="850" y1="0" x2="850" y2="360" stroke-dasharray="4,4" />
  </g>

  <!-- Animated Radar Sweep Line & Cone -->
  <g class="radar-sweep-line">
    <path d="M 850 180 L 1090 180 A 240 240 0 0 0 850 -60 Z" fill="url(#radarSweep)" />
    <line x1="850" y1="180" x2="1090" y2="180" stroke="#38BDF8" stroke-width="2" filter="url(#glow)" />
  </g>

  <!-- Radar Target Blips & Trajectory Path -->
  <g fill="none">
    <path class="flight-path" d="M 100 280 Q 400 80 820 120 T 940 220" stroke="#38BDF8" stroke-width="2.5" opacity="0.6" />
    <!-- Blip 1 -->
    <circle class="blip-1" cx="820" cy="120" r="6" fill="#38BDF8" filter="url(#glow)" />
    <circle class="blip-1" cx="820" cy="120" r="12" stroke="#38BDF8" stroke-width="1" opacity="0.5" />
    <!-- Blip 2 -->
    <circle class="blip-2" cx="940" cy="220" r="6" fill="#A855F7" filter="url(#glow)" />
    <!-- Blip 3 -->
    <circle class="blip-3" cx="750" cy="240" r="5" fill="#34D399" filter="url(#glow)" />
  </g>

  <!-- Aircraft Icon (SVG Vector) -->
  <g transform="translate(810, 105) rotate(-15) scale(0.7)" fill="#38BDF8" filter="url(#glow)">
    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
  </g>

  <!-- Foreground Content: Header Badge, Title, Subtitle, Status Tags -->
  <!-- Top Category Tag -->
  <g transform="translate(70, 55)">
    <rect width="250" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="125" y="20" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">
      ✈️ AVIATION SAFETY ECOSYSTEM
    </text>
  </g>

  <!-- Main Title -->
  <text x="70" y="130" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
    Awesome Aviation Safety Management
  </text>

  <!-- Subtitle -->
  <text x="70" y="168" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
    Curated SaaS Platforms, Open-Source SMS &amp; Regulatory Compliance Software
  </text>

  <!-- Standards & Framework Pills -->
  <g transform="translate(70, 210)">
    <!-- Pill 1: ICAO Annex 19 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="65" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ ICAO Annex 19</text>
    </g>
    <!-- Pill 2: FAA Part 5 -->
    <g transform="translate(140, 0)">
      <rect width="115" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="57" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">📋 FAA Part 5</text>
    </g>
    <!-- Pill 3: EASA Part-IS -->
    <g transform="translate(265, 0)">
      <rect width="125" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="62" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🇪🇺 EASA Part-IS</text>
    </g>
    <!-- Pill 4: ECCAIRS2 & ADREP -->
    <g transform="translate(400, 0)">
      <rect width="155" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="77" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">📊 ECCAIRS2 / ADREP</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="70" y="275" width="500" height="2" fill="url(#textGrad)" opacity="0.6" />
</svg>
